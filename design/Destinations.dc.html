<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><title>Destinations — An Atlas of Bhutan</title><script src="assets/data.js"></script><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>body{margin:0;background:#0f0e0b}a{color:inherit;text-decoration:none}a:hover{color:#e3a23a}</style></helmet>
<dc-import name="Nav" hint-size="100%,76px"></dc-import>
<main data-screen-label="Destinations atlas" style="background:#0f0e0b;color:#f5f1e8;font-family:'Archivo',sans-serif;display:grid;grid-template-columns:{{ cols }};min-height:100vh;">
  <div style="position:sticky;top:0;height:{{ mapH }};z-index:2;background:#0f0e0b;">
    <div style="position:absolute;left:clamp(16px,3vw,40px);top:104px;z-index:2;pointer-events:none;">
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.24em;color:#e3a23a;">AN ATLAS OF BHUTAN</div>
      <h1 style="margin:14px 0 0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(48px,6vw,104px);line-height:.88;">Destinations</h1>
    </div>
    <dc-import name="BhutanMap" markers="{{ ids }}" active-id="{{ active }}" on-hover="{{ onHover }}" on-select="{{ onSelect }}" labels="all" style="position:absolute;inset:76px 0 0 0;" hint-size="100%,100%"></dc-import>
    <div style="position:absolute;left:clamp(16px,3vw,40px);bottom:24px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:rgba(245,241,232,.75);">{{ coords }}</div>
  </div>
  <div style="position:relative;border-left:1px solid rgba(245,241,232,.08);">
    <div style="position:sticky;top:0;height:46vh;min-height:320px;overflow:hidden;z-index:1;background:#1b1a16;">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="0">
        <div role="img" aria-label="{{ r.name }}" style="position:absolute;inset:0;width:100%;height:100%;opacity:{{ r.imgOp }};transform:scale({{ r.imgScale }});transition:opacity .7s ease, transform 2s cubic-bezier(.2,.6,.2,1);view-transition-name:{{ r.vt }};background-image:{{ r.imgBg }};background-size:cover;background-position:center;"></div>
      </sc-for>
      <div style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(15,14,11,1) 0%,rgba(15,14,11,0) 45%);"></div>
      <div style="position:absolute;left:clamp(16px,3vw,40px);right:clamp(16px,3vw,40px);bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;">
        <span style="font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(20px,1.8vw,28px);line-height:1.15;max-width:30ch;">{{ cur.line }}</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:#e3a23a;white-space:nowrap;">{{ cur.kindU }}</span>
      </div>
    </div>
    <div style="padding:8px clamp(16px,3vw,40px) 80px;">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
        <a href="{{ r.page }}" onMouseEnter="{{ r.enter }}" data-cursor="ENTER" style="display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:16px;align-items:baseline;padding:20px 0;border-bottom:1px solid rgba(245,241,232,.1);color:{{ r.color }};transition:color .3s;">
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#e3a23a;">{{ r.no }}</span>
          <span style="font-family:'Instrument Serif',serif;font-size:clamp(34px,3.4vw,56px);line-height:.95;font-style:{{ r.it }};transform:translateX({{ r.tx }});transition:transform .5s cubic-bezier(.2,.7,.2,1);">{{ r.name }}</span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-align:right;line-height:1.8;color:rgba(245,241,232,.7);">{{ r.altU }}<br>{{ r.regionU }}</span>
        </a>
      </sc-for>
      <a href="Map.dc.html" style="display:inline-flex;gap:14px;margin-top:40px;font-size:12px;font-weight:500;letter-spacing:.22em;border-bottom:1px solid #e3a23a;padding-bottom:8px;">OPEN THE FULL INTERACTIVE MAP <span style="font-family:'JetBrains Mono',monospace;">→</span></a>
    </div>
  </div>
</main>
<dc-import name="Footer" hint-size="100%,420px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { const v = this._rvImg(); const isU = s => typeof s === 'string' && /^(https?:|assets\/|data:)/.test(s); const seen = new Set(); const add = o => { if (!o || typeof o !== 'object' || seen.has(o) || o.$typeof || o instanceof Element || 'current' in o) return o; seen.add(o); if (Array.isArray(o)) { o.forEach(add); return o; } if (Object.getPrototypeOf(o) !== Object.prototype) return o; for (const k of Object.keys(o)) { const x = o[k]; if (isU(x)) o[k + 'Bg'] = 'url("' + x + '")'; else if (x && typeof x === 'object') add(x); } return o; }; return v ? add({ ...v }) : v; }
  state = { active: 'punakha', w: 1200 };
  componentDidMount() {
    const w = () => window.BMV ? this.forceUpdate() : setTimeout(w, 60); w();
    const d = new URLSearchParams(location.search).get('d'); if (d) this.setState({ active: d });
    this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.onR); this.onR();
  }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  _rvImg() {
    const B = window.BMV; if (!B) return { rows: [], ids: [], cur: {} };
    const st = this.state, narrow = st.w < 900;
    const order = ['paro', 'taktsang', 'haa', 'thimphu', 'dochula', 'punakha', 'phobjikha', 'trongsa', 'bumthang', 'trashigang', 'jangothang'];
    const c = B.byId[st.active] || B.byId.punakha;
    const rows = order.map((id, i) => { const d = B.byId[id], on = id === st.active; return { ...d, img: d.img || B.brand.undiscovered, no: String(i + 1).padStart(2, '0'), altU: d.alt.toLocaleString('en-US') + ' M', regionU: d.region.toUpperCase(), color: on ? '#e3a23a' : '#f5f1e8', it: on ? 'italic' : 'normal', tx: on ? '12px' : '0', imgOp: on ? 1 : 0, imgScale: on ? 1 : 1.08, vt: on ? 'dest-' + id : 'none', enter: () => this.setState({ active: id }) }; });
    return {
      rows, ids: order, active: st.active, cur: { line: c.line, kindU: c.kind.toUpperCase() },
      coords: c.name.toUpperCase() + ' · ' + c.lat.toFixed(4) + '° N · ' + c.lon.toFixed(4) + '° E',
      onHover: id => id && this.setState({ active: id }), onSelect: id => { location.href = B.byId[id].page; },
      cols: narrow ? '1fr' : 'minmax(0,1.35fr) minmax(0,1fr)', mapH: narrow ? '60vh' : '100vh'
    };
  }
}
</script>
</body>
</html>
