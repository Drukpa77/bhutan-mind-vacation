<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><title>Stories from the Kingdom — Bhutan Mind Vacation</title><script src="assets/data.js"></script><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Archivo:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><style>body{margin:0;background:#f5f1e8}a{color:inherit;text-decoration:none}a:hover{color:#8f2b1f}</style></helmet>
<dc-import name="Nav" tone="dark" solid="{{ true }}" hint-size="100%,76px"></dc-import>
<main style="background:#f5f1e8;color:#1b1a16;font-family:'Archivo',sans-serif;padding:150px clamp(16px,5vw,80px) 120px;">
  <header data-screen-label="Stories masthead" style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:24px;border-bottom:2px solid #1b1a16;padding-bottom:20px;">
    <h1 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(56px,9vw,160px);line-height:.85;letter-spacing:-.02em;">Stories <span style="font-style:italic;">from the Kingdom</span></h1>
    <div style="display:flex;gap:6px;flex-wrap:wrap;">
      <sc-for list="{{ kickers }}" as="k" hint-placeholder-count="5"><button onClick="{{ k.click }}" style="all:unset;cursor:pointer;padding:8px 12px;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.18em;background:{{ k.bg }};color:{{ k.fg }};">{{ k.label }}</button></sc-for>
    </div>
  </header>

  <sc-for list="{{ lead }}" as="s" hint-placeholder-count="0">
    <a href="{{ s.href }}" data-cursor="READ" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:40px;padding:56px 0;border-bottom:1px solid rgba(27,26,22,.2);color:#1b1a16;">
      <div style="grid-column:span 2;min-width:0;overflow:hidden;aspect-ratio:16/10;background:#e2dacb;"><div role="img" aria-label="{{ s.title }}" style="width:100%;height:100%;transition:transform 1.6s cubic-bezier(.2,.6,.2,1);view-transition-name:story-hero;background-image:{{ s.imgBg }};background-size:cover;background-position:center;" style-hover="transform:scale(1.03)"></div></div>
      <div style="display:flex;flex-direction:column;justify-content:flex-end;gap:20px;">
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:#8f2b1f;">{{ s.kickerU }} · {{ s.date }}</div>
        <h2 style="margin:0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(44px,5vw,88px);line-height:.9;">{{ s.title }}</h2>
        <p style="margin:0;font-size:16px;line-height:1.7;color:#4a4439;">{{ s.dek }}</p>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;">READ THE STORY →</span>
      </div>
    </a>
  </sc-for>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:48px 40px;padding-top:56px;align-items:start;">
    <sc-for list="{{ rest }}" as="s" hint-placeholder-count="0">
      <a href="{{ s.href }}" data-cursor="READ" style="display:block;color:#1b1a16;margin-top:{{ s.mt }};">
        <div style="overflow:hidden;aspect-ratio:{{ s.ratio }};background:#e2dacb;"><div role="img" aria-label="{{ s.title }}" style="width:100%;height:100%;background-image:{{ s.imgBg }};background-size:cover;background-position:center;"></div></div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.2em;color:#8f2b1f;margin-top:18px;">{{ s.kickerU }} · {{ s.date }}</div>
        <h3 style="margin:10px 0 0;font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(28px,2.4vw,40px);line-height:1;">{{ s.title }}</h3>
        <p style="margin:10px 0 0;font-size:14px;line-height:1.6;color:#4a4439;">{{ s.dek }}</p>
      </a>
    </sc-for>
  </div>
</main>
<dc-import name="Footer" hint-size="100%,420px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { const v = this._rvImg(); const isU = s => typeof s === 'string' && /^(https?:|assets\/|data:)/.test(s); const seen = new Set(); const add = o => { if (!o || typeof o !== 'object' || seen.has(o) || o.$typeof || o instanceof Element || 'current' in o) return o; seen.add(o); if (Array.isArray(o)) { o.forEach(add); return o; } if (Object.getPrototypeOf(o) !== Object.prototype) return o; for (const k of Object.keys(o)) { const x = o[k]; if (isU(x)) o[k + 'Bg'] = 'url("' + x + '")'; else if (x && typeof x === 'object') add(x); } return o; }; return v ? add({ ...v }) : v; }
  state = { k: null };
  componentDidMount() { const w = () => window.BMV ? this.forceUpdate() : setTimeout(w, 60); w(); }
  _rvImg() {
    const B = window.BMV; if (!B) return { kickers: [], lead: [], rest: [] };
    const ks = [...new Set(B.stories.map(s => s.kicker))];
    const list = B.stories.filter(s => !this.state.k || s.kicker === this.state.k).map((s, i) => ({ ...s, kickerU: s.kicker.toUpperCase(), href: s.id === 'hidden-gem' ? 'Story.dc.html' : 'Story.dc.html?s=' + s.id, ratio: ['4/5', '1/1', '3/4', '5/4'][i % 4], mt: i % 3 === 1 ? '80px' : '0' }));
    const lead = list.find(s => s.id === 'hidden-gem') ? [list.find(s => s.id === 'hidden-gem')] : list.slice(0, 1);
    return {
      kickers: [{ label: 'ALL', v: null }, ...ks.map(k => ({ label: k.toUpperCase(), v: k }))].map(k => ({ label: k.label, bg: this.state.k === k.v ? '#1b1a16' : 'transparent', fg: this.state.k === k.v ? '#f5f1e8' : '#1b1a16', click: () => this.setState({ k: k.v }) })),
      lead, rest: list.filter(s => s !== lead[0])
    };
  }
}
</script>
</body>
</html>
