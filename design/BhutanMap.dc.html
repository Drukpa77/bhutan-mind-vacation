<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="assets/data.js"></script><script src="assets/geo.js"></script><style>@keyframes bmvpulse{0%{transform:scale(.7);opacity:.85}100%{transform:scale(3);opacity:0}}@keyframes bmvdraw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}</style></helmet>
<div ref="{{ boxRef }}" style="position:relative;width:100%;height:100%;min-height:200px;overflow:hidden;">{{ map }}</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:640},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;},&quot;markers&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;route&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;progress&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;activeId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hoverId&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;focus&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onHover&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string|null)=&gt;void&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string)=&gt;void&quot;},&quot;labels&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;all&quot;,&quot;active&quot;,&quot;none&quot;],&quot;default&quot;:&quot;all&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;numbered&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;fit&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;meet&quot;,&quot;slice&quot;],&quot;default&quot;:&quot;meet&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { geo: null, cw: 0, ch: 0 };
  boxRef = React.createRef();
  componentWillUnmount() { this.ro && this.ro.disconnect(); }
  componentDidMount() {
    const el = this.boxRef.current; if (el) { this.ro = new ResizeObserver(() => this.setState({ cw: el.clientWidth, ch: el.clientHeight })); this.ro.observe(el); }
    const go = () => (window.BMVGeo && window.BMV) ? window.BMVGeo.load().then(geo => this.setState({ geo })) : setTimeout(go, 60);
    go();
  }
  renderVals() {
    const h = React.createElement, p = this.props, G = window.BMVGeo, B = window.BMV;
    if (!G || !B) return { map: null, boxRef: this.boxRef };
    const W = G.W, H = G.H, dark = (p.variant || 'dark') === 'dark';
    const ink = dark ? '#f5f1e8' : '#1b1a16', acc = p.accent || (dark ? '#e3a23a' : '#8f2b1f');
    const ids = p.markers || B.dest.map(d => d.id);
    const markers = ids.map(i => typeof i === 'string' ? B.byId[i] : i).filter(Boolean).map(d => { const [x, y] = G.project(d.lon, d.lat); return { ...d, x, y }; });
    const route = (p.route || []).map(i => B.byId[i]).filter(Boolean).map(d => { const [x, y] = G.project(d.lon, d.lat); return { id: d.id, x, y }; });
    const prog = p.progress == null ? route.length - 1 : Math.max(0, Math.min(route.length - 1, p.progress));
    const flights = p.flights || [];
    const focus = p.focus ? markers.find(m => m.id === p.focus) || (B.byId[p.focus] && (() => { const d = B.byId[p.focus]; const [x, y] = G.project(d.lon, d.lat); return { x, y }; })()) : null;
    const s = focus ? (p.zoom || 2.6) : 1;
    const tx = focus ? W * (p.focusX || 0.5) - focus.x * s : 0, ty = focus ? H / 2 - focus.y * s : 0;
    const active = p.activeId, hover = p.hoverId;
    const LBL = { haa: 'w', taktsang: 'w', dochula: 'n', paro: 's', jangothang: 'e', thimphu: 'e', wangdue: 's' };
    const mono = "'JetBrains Mono', ui-monospace, monospace";
    const kids = [];
    
    if (p.graticule !== false) {
      [89, 90, 91, 92].forEach(lon => { const [x] = G.project(lon, 27); kids.push(h('line', { key: 'gx' + lon, x1: x, x2: x, y1: 0, y2: H, stroke: ink, strokeOpacity: 0.09, strokeWidth: 0.6 / s, strokeDasharray: `${2 / s} ${6 / s}` }), h('text', { key: 'gtx' + lon, x: x + 4 / s, y: H - 10 / s, fill: ink, fillOpacity: 0.4, fontSize: 9 / s, fontFamily: mono, letterSpacing: 1 / s }, lon + '°E')); });
      [27, 27.5, 28].forEach(lat => { const [, y] = G.project(89, lat); kids.push(h('line', { key: 'gy' + lat, x1: 0, x2: W, y1: y, y2: y, stroke: ink, strokeOpacity: 0.09, strokeWidth: 0.6 / s, strokeDasharray: `${2 / s} ${6 / s}` }), h('text', { key: 'gty' + lat, x: 8 / s, y: y - 4 / s, fill: ink, fillOpacity: 0.4, fontSize: 9 / s, fontFamily: mono, letterSpacing: 1 / s }, lat.toFixed(1) + '°N')); });
    }
    if (this.state.geo) {
      if (p.districts !== false) this.state.geo.districts.forEach((d, i) => kids.push(h('path', { key: 'd' + i, d: d.d, fill: 'none', stroke: ink, strokeOpacity: dark ? 0.16 : 0.2, strokeWidth: 0.7 / s })));
      kids.push(h('path', { key: 'ol', d: this.state.geo.outline, fill: 'none', stroke: dark ? '#efd9ae' : '#3a2a1c', strokeOpacity: 0.7, strokeWidth: 1.4 / s }));
    }
    if (route.length > 1) {
      for (let i = 0; i < route.length - 1; i++) {
        const a = route[i], b = route[i + 1], fl = flights.includes(i);
        kids.push(h('line', { key: 'rb' + i, x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: ink, strokeOpacity: 0.28, strokeWidth: 1 / s, strokeDasharray: `${3 / s} ${4 / s}` }));
        const t = Math.max(0, Math.min(1, prog - i));
        if (t > 0) kids.push(h('line', { key: 'rp' + i, x1: a.x, y1: a.y, x2: a.x + (b.x - a.x) * t, y2: a.y + (b.y - a.y) * t, stroke: acc, strokeWidth: 2.2 / s, strokeLinecap: 'round', strokeDasharray: fl ? `${6 / s} ${5 / s}` : null }));
      }
      const hi = Math.floor(prog), t = prog - hi, a = route[hi], b = route[Math.min(hi + 1, route.length - 1)];
      const hx = a.x + (b.x - a.x) * t, hy = a.y + (b.y - a.y) * t;
      kids.push(h('circle', { key: 'head', cx: hx, cy: hy, r: 5 / s, fill: acc, style: { filter: `drop-shadow(0 0 ${6 / s}px ${acc})` } }));
    }
    const routeIdx = id => route.findIndex(r => r.id === id);
    markers.forEach(m => {
      const ri = routeIdx(m.id), onRoute = ri >= 0, lit = onRoute ? ri <= prog + 0.001 : true;
      const isA = m.id === active || m.id === hover;
      const r = (isA ? 6.5 : onRoute ? 4.5 : 4) / s;
      const pos = LBL[m.id] || 'e';
      const dx = pos === 'w' ? -12 / s : pos === 'e' ? 12 / s : 0, dy = pos === 'n' ? -14 / s : pos === 's' ? 20 / s : 4 / s;
      const anchor = pos === 'w' ? 'end' : pos === 'e' ? 'start' : 'middle';
      const showLabel = p.labels === 'none' ? false : p.labels === 'active' ? isA : true;
      const g = [];
      if (isA) g.push(h('circle', { key: 'p', r: 7 / s, fill: 'none', stroke: acc, strokeWidth: 1.2 / s, style: { transformBox: 'fill-box', transformOrigin: 'center', animation: 'bmvpulse 1.8s ease-out infinite' } }));
      g.push(h('circle', { key: 'c', r, fill: lit ? (isA ? acc : (dark ? '#f5f1e8' : '#1b1a16')) : 'transparent', stroke: lit ? (dark ? '#14130f' : '#f5f1e8') : ink, strokeOpacity: lit ? 1 : 0.5, strokeWidth: 1.2 / s, style: { transition: 'r .25s' } }));
      if (showLabel) g.push(h('text', { key: 't', x: dx, y: dy, textAnchor: anchor, fill: ink, fillOpacity: lit ? (isA ? 1 : 0.85) : 0.4, fontSize: (isA ? 13 : 10.5) / s, fontFamily: mono, letterSpacing: 1.6 / s, fontWeight: isA ? 600 : 400, style: { paintOrder: 'stroke', stroke: dark ? 'rgba(10,10,8,.65)' : 'rgba(245,241,232,.8)', strokeWidth: 3 / s, transition: 'font-size .25s' } }, (p.numbered && onRoute ? String(ri + 1).padStart(2, '0') + ' ' : '') + (m.short || m.name).toUpperCase()));
      g.push(h('circle', { key: 'hit', r: 22 / s, fill: 'transparent', style: { cursor: 'pointer' },
        onMouseEnter: () => p.onHover && p.onHover(m.id), onMouseLeave: () => p.onHover && p.onHover(null),
        onClick: () => p.onSelect && p.onSelect(m.id), 'data-cursor': 'OPEN' }));
      kids.push(h('g', { key: 'm' + m.id, transform: `translate(${m.x},${m.y})` }, g));
    });
    const cw = this.state.cw || 1, ch = this.state.ch > 10 ? this.state.ch : cw * H / W;
    const k = p.fit === 'slice' ? Math.max(cw / W, ch / H) : Math.min(cw / W, ch / H);
    const svg = h('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, style: { position: 'absolute', inset: 0, overflow: 'visible' } }, kids);
    const camera = h('div', { style: { position: 'absolute', inset: 0, transform: `translate(${tx}px,${ty}px) scale(${s})`, transformOrigin: '0 0', transition: 'transform 1.4s cubic-bezier(.7,0,.2,1)' } },
      h('img', { src: dark ? 'assets/geo/terrain-dark.jpg' : 'assets/geo/terrain-light.jpg', alt: 'Shaded relief of Bhutan', draggable: false, style: { position: 'absolute', inset: 0, width: W, height: H, opacity: p.terrainOpacity ?? 1, userSelect: 'none' } }), svg);
    const stage = h('div', { style: { position: 'absolute', left: (cw - W * k) / 2, top: (ch - H * k) / 2, width: W, height: H, transform: `scale(${k})`, transformOrigin: '0 0', visibility: this.state.cw ? 'visible' : 'hidden' } }, camera);
    const hz = dark ? '15,14,11' : '243,238,228';
    const haze = p.haze === false ? null : h('div', { style: { position: 'absolute', inset: 0, pointerEvents: 'none', boxShadow: `inset 0 0 ${Math.round(Math.min(cw, ch) * 0.18)}px ${Math.round(Math.min(cw, ch) * 0.08)}px rgb(${hz})` } });
    return { map: [h('div', { key: 's', style: { position: 'absolute', inset: 0 } }, stage), h('div', { key: 'h' }, haze)], boxRef: this.boxRef };
  }
}
</script>
</body>
</html>
